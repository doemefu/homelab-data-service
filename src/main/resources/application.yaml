spring:
  application:
    name: data-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/data_service}
    username: ${DB_USERNAME:data_service}
    password: ${DB_PASSWORD}

  # docs/060 §3.1/§3.4: history table in public, telemetry in the netmon schema.
  flyway:
    enabled: true
    table: flyway_schema_history_data
    default-schema: public
    schemas: public,netmon

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keys come from the cluster-internal JWKS. issuer-uri is set as well so that the
          # iss claim is validated; with jwk-set-uri present Boot needs no OIDC discovery call
          # (docs/060 §7.5).
          jwk-set-uri: ${JWKS_URI:http://localhost:8080/oauth2/jwks}
          issuer-uri: ${JWT_ISSUER:https://auth.furchert.ch}

  # docs/060 §4.1: every collector runs on the Boot-managed scheduler.
  task:
    scheduling:
      pool:
        size: 4

  # The service serves no static content; unknown paths become 404 problem+json.
  web:
    resources:
      add-mappings: false

server:
  port: 8082
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

netmon:
  api:
    # docs/060 §7.5 (v1): only these token subjects may read /api/netmon/**.
    allowed-clients: [ furchert-ch ]
  # docs/060 §4.2, §9. Token and zone id come from Secret data-service-secrets; blank = the
  # Cloudflare collectors report `credentials` instead of calling out.
  cloudflare:
    graphql-url: ${CLOUDFLARE_GRAPHQL_URL:https://api.cloudflare.com/client/v4/graphql}
    api-token: ${CLOUDFLARE_API_TOKEN:}
    zone-id: ${CLOUDFLARE_ZONE_ID:}
  # docs/060 §4.5: the reputation collector stays unavailable while the key is blank.
  abuseipdb:
    api-key: ${ABUSEIPDB_API_KEY:}
  # docs/060 §4.6, §9: the cluster Prometheus that carries the NM-3 node-script and NM-2 coroot metrics (no credentials).
  prometheus:
    url: ${PROMETHEUS_URL:http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090}
